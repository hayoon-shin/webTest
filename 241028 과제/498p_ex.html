<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        document.write(`<h1>구구단</h1>`);
        for(let i=1; i<10; i++){
            document.write(`<div class="gugu_div">`);
            document.write("<h3>"+i+"단</h3>");
            for(let j=1; j<10; j++) {
                
                document.write(i+"X"+j+"="+(i*j)+"<br>");
            }
            document.write("</div>");
        }
    </script>
    <style>
        .gugu_div {
            display: inline-block;
            width: 100px;
            height: 270px;
            border: 1px solid black;
            text-align: center;
            margin: 10px;
        }
    </style>
</head>

</html>
