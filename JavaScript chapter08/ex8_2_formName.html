<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        b {
            color: red;
        }
    </style>
</head>
<body>
    <form action="#" method="get" name="login">
        <label for="id">사용자ID</label><br>
        <input type="text" name="userid" id="userid"><span></span><br>
        <label for="pwd">패스워드</label><br>
        <input type="password" name="userpwd" id="pwd"> <br>
        <button type="button">log in</button>
    </form>

    <script>
        //이벤트를 설정할 객체를 찾는다
        const btnObj = document.querySelector('[type="button"]')
        //이벤트 설정한다
        btnObj.addEventListener("click",()=>{
            const userid = document.login.useid;
            const pwd = document.querySelector("#pwd");
           if(userid.value.length < 8 || userid.value.length > 14) {
                userid.nextSibling.innerHtml = `<b>8글자 미만이나 14글자 초과안됩니다</b>`; // nextSibling -span태그를 뜻한다.
                userid.value="";
                userid.focus();
                return;
            }else {
                userid.nextSibling.innerHTML= `<b>성공</b>`;
            }
            if(pwd.value.length < 8 || pwd.value.length > 14) {
                pwd.nextSibling.innerHtml = `<b>8글자 미만이나 14글자 초과안됩니다</b>`; 
                pwd.value="";
                pwd.focus();
                return;
            }
            else {
                pwd.nextSibling.innerHTML= `<b>성공</b>`;
            }
        });
      
    </script>
</body>
</html>
