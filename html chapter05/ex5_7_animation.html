<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes down {
            0%  {transform: translateY(0px) scale(1,1) rotateX(0deg);
                border: 10%;
                border: 1px dotted black;
            }

            50%{transform: translateY(300px) scale(2,2) rotateX(180deg);
                border-radius: 50%;
            }

            100%{transform: translateY(0px) scale(1,1) rotateX(0deg);
                border: 1px solid red;
            }
        }

        body img:nth-child(1){
            animation: down 3s;
        }
        body img:nth-child(2){
            animation: down 4s infinite; 
        }
        body img:nth-child(3){
            animation: down 2s infinite alternate; 
        }
        body img:nth-child(4){
            animation: down 3s cubic-bezier(.17,.67,1,-0.59); 
        }


    </style>
</head>
<body>
    <img src="/media/KakaoTalk_20241021_101837207.png" alt="">
    <img src="/media/KakaoTalk_20241021_101837109.png" alt="">
    <img src="/media/KakaoTalk_20241021_101837522.png" alt="">
    <img src="/media/KakaoTalk_20241021_101848319.png" alt="">
</body>
</html>
